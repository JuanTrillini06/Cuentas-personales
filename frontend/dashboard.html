<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <div class="navbar">
            <h2>Gestor de Gastos</h2>
            <div class="nav-links">
                <span id="userGreeting">Hola!</span>
                <button id="themeToggleBtn" class="btn" style="padding: 5px 10px; margin-left: 10px; background: transparent; border: 1px solid var(--border-color);">🌓</button>
                <button onclick="logout()" class="btn btn-danger" style="padding: 5px 10px; margin-left: 10px;">Salir</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Dashboard Overview -->
        <div class="grid">
            <div class="card">
                <h3>Balance General por Moneda</h3>
                <div id="balancesContainer" class="mt-1">
                    Cargando balances...
                </div>
            </div>
            <div class="card">
                <h3>Gastos por Categoría</h3>
                <div style="max-height: 250px; display: flex; justify-content: center;">
                    <canvas id="expensesChart"></canvas>
                </div>
            </div>
        </div>

        <div class="grid">
            <!-- Cuentas -->
            <div class="card">
                <div class="flex">
                    <h3>Mis Cuentas</h3>
                    <button class="btn btn-primary" onclick="openModal('accountModal')">+ Nueva</button>
                </div>
                <div id="accountsList" class="mt-1">
                    Cargando cuentas...
                </div>
            </div>

            <!-- Movimientos -->
            <div class="card">
                <div class="flex">
                    <h3>Movimientos</h3>
                    <button class="btn btn-primary" onclick="openModal('movementModal')">+ Nuevo</button>
                </div>
                <div id="movementsList" class="mt-1" style="max-height: 400px; overflow-y: auto;">
                    Cargando movimientos...
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="flex">
                <h3>Mis Etiquetas</h3>
                <button class="btn btn-primary" onclick="openModal('tagModal')">+ Nueva Etiqueta</button>
            </div>
            <div id="tagsList" class="mt-1 flex" style="flex-wrap: wrap; gap: 10px; justify-content: flex-start;">
                Cargando etiquetas...
            </div>
        </div>
    </div>

    <!-- Modal Cuenta -->
    <div id="accountModal" class="modal">
        <div class="modal-content">
            <h3>Nueva Cuenta</h3>
            <form id="accountForm" class="mt-1">
                <div class="form-group">
                    <label>Nombre de cuenta</label>
                    <input type="text" id="accName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Entidad Bancaria</label>
                    <input type="text" id="accBank" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Moneda (Ej. USD, ARS)</label>
                    <input type="text" id="accCurrency" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Monto Inicial</label>
                    <input type="number" id="accInitial" class="form-control" placeholder="0" required>
                </div>
                <div class="flex">
                    <button type="button" class="btn btn-danger" onclick="closeModal('accountModal')">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Movimiento -->
    <div id="movementModal" class="modal">
        <div class="modal-content">
            <h3>Nuevo Movimiento</h3>
            <form id="movementForm" class="mt-1">
                <div class="form-group">
                    <label>Cuenta</label>
                    <select id="movAccount" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="movType" class="form-control" required>
                        <option value="Entrada">Entrada (Ingreso)</option>
                        <option value="Salida">Salida (Gasto)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Monto</label>
                    <input type="number" id="movAmount" class="form-control" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <input type="text" id="movDesc" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Etiqueta</label>
                    <select id="movTag" class="form-control"></select>
                </div>
                <div class="flex">
                    <button type="button" class="btn btn-danger" onclick="closeModal('movementModal')">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Etiqueta -->
    <div id="tagModal" class="modal">
        <div class="modal-content">
            <h3>Nueva Etiqueta</h3>
            <form id="tagForm" class="mt-1">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="tagName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="color" id="tagColor" class="form-control" value="#8ab6d6">
                </div>
                <div class="flex">
                    <button type="button" class="btn btn-danger" onclick="closeModal('tagModal')">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
